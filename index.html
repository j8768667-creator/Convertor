<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pulsark Sampler & Sequencer Studio</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg-color: #0b0f19;
      --panel-bg: #111827;
      --card-bg: #1f293d;
      --accent-color: #00e676;
      --accent-hover: #00c853;
      --btn-blue: #1d4ed8;
      --btn-blue-hover: #2563eb;
      --btn-red: #dc2626;
      --btn-red-hover: #b91c1c;
      --text-color: #f3f4f6;
      --muted-text: #9ca3af;
      --border-color: #374151;
      --step-active: #00e676;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1280px;
      margin: 0 auto 15px auto;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 10px;
    }

    h1 { margin: 0; font-size: 1.3rem; color: #fff; }
    .header-actions { display: flex; gap: 8px; }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
    }

    /* Compact Sequencer Section */
    .sequencer-card {
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px 14px;
    }

    .seq-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .seq-controls { display: flex; align-items: center; gap: 10px; }

    .seq-grid-container {
      overflow-x: auto;
    }

    .seq-grid {
      display: grid;
      grid-template-columns: 100px repeat(16, minmax(20px, 1fr));
      gap: 2px;
      align-items: center;
    }

    .seq-row-label {
      font-size: 0.7rem;
      font-weight: bold;
      color: var(--muted-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .seq-step {
      height: 18px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 2px;
      cursor: pointer;
    }

    .seq-step.active { background-color: var(--step-active); border-color: #00ff84; }
    .seq-step.current-play { box-shadow: 0 0 6px #fff; border-color: #fff; }

    /* Sound Control & Waveform Panel */
    .sound-editor-card {
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
    }

    .editor-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .sound-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
    }

    .audio-playback-actions {
      display: flex;
      gap: 8px;
    }

    /* WAV Waveform Editor Canvas & Trim Controls */
    .waveform-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 15px;
    }

    .waveform-canvas-container {
      position: relative;
      width: 100%;
      height: 100px;
      background-color: #000;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .trim-slider-container {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
    }

    .control-group label {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      margin-bottom: 4px;
      color: var(--muted-text);
      text-transform: uppercase;
      font-weight: 600;
    }

    .control-group input[type="range"] {
      width: 100%;
      accent-color: #3b82f6;
    }

    .dropdown-group {
      display: flex;
      gap: 12px;
    }

    .select-wrapper {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    .select-wrapper label {
      font-size: 0.7rem;
      color: var(--muted-text);
      text-transform: uppercase;
      font-weight: 600;
    }

    select {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 6px 10px;
      border-radius: 4px;
      outline: none;
    }

    /* Library Panels & Collapsible Trees */
    .library-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .lib-card {
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
    }

    .lib-card h3 {
      margin-top: 0;
      font-size: 0.95rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sample-list {
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 8px;
    }

    /* Folder Tree UI Components */
    details.folder-tree {
      margin-left: 6px;
      border-left: 2px solid var(--border-color);
      padding-left: 6px;
    }

    details.folder-tree > summary {
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: bold;
      color: #60a5fa;
      padding: 4px 0;
      user-select: none;
    }

    details.folder-tree > summary:hover {
      color: #93c5fd;
    }

    .sample-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--card-bg);
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      margin-top: 3px;
    }

    .sample-item button {
      padding: 3px 6px;
      font-size: 0.7rem;
    }

    /* Pads Grid */
    .pads-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    .pad-btn {
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px;
      color: var(--text-color);
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 55px;
      transition: all 0.1s ease;
    }

    .pad-btn:hover { border-color: #3b82f6; }
    .pad-btn.active { border-color: var(--accent-color); box-shadow: 0 0 8px rgba(0,230,118,0.2); }
    .pad-btn.playing { background-color: #1e293b; transform: scale(0.98); }

    .pad-index { font-size: 0.6rem; color: var(--muted-text); font-weight: bold; }
    .pad-name { font-weight: bold; font-size: 0.75rem; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* UI Buttons */
    .btn {
      background-color: var(--btn-blue);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover { background-color: var(--btn-blue-hover); }
    .btn-green { background-color: var(--accent-color); color: #000; }
    .btn-green:hover { background-color: var(--accent-hover); }
    .btn-red { background-color: var(--btn-red); color: white; }
    .btn-red:hover { background-color: var(--btn-red-hover); }
    .btn-secondary { background-color: #374151; }
    .btn-secondary:hover { background-color: #4b5563; }

    input[type="number"] {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 4px 6px;
      border-radius: 4px;
      width: 50px;
      font-size: 0.8rem;
    }

    input[type="file"] { display: none; }
  </style>
</head>
<body>

  <header>
    <h1>Pulsark Sampler, Sequencer & WAV Trimmer</h1>
    <div class="header-actions">
      <button id="importPkbankBtn" class="btn btn-secondary">Import .pkbank</button>
      <button id="uploadFolderBtn" class="btn btn-secondary">Upload Folder</button>
      <button id="uploadSampleBtn" class="btn btn-secondary">Upload Files</button>
      <button id="exportSeqWavBtn" class="btn btn-green">Export Sequence WAV</button>

      <input type="file" id="pkbankInput" accept=".pkbank,.zip">
      <input type="file" id="userFolderInput" webkitdirectory directory multiple>
      <input type="file" id="userSampleInput" accept="audio/*,video/*,.wav,.mp3,.aac,.flac,.m4a,.ogg,.mp4,.mov,.webm,.avi,.mkv" multiple>
    </div>
  </header>

  <div class="container">
    
    <div class="sequencer-card">
      <div class="seq-header">
        <h3 style="margin:0; font-size:0.9rem;">Compact Pattern Sequencer</h3>
        <div class="seq-controls">
          <label style="font-size:0.75rem; color: var(--muted-text);">
            BPM: <input type="number" id="bpmInput" value="120" min="40" max="240">
          </label>
          <button id="clearSeqBtn" class="btn btn-red">Clear Pattern</button>
          <button id="playSeqBtn" class="btn btn-green">Play Sequence</button>
        </div>
      </div>
      <div class="seq-grid-container">
        <div class="seq-grid" id="seqGrid"></div>
      </div>
    </div>

    <div class="sound-editor-card">
      <div class="editor-top-bar">
        <div>
          <span style="font-size:0.7rem; color:var(--muted-text); font-weight:bold;">PAD <span id="currentPadNum">01</span></span>
          <div class="sound-title" id="currentSoundTitle">BD 808</div>
        </div>
        <div class="audio-playback-actions">
          <button id="auditionBtn" class="btn btn-green" style="display:flex; align-items:center; gap:6px;">
            ▶ Play Sample
          </button>
          <button id="stopSampleBtn" class="btn btn-red" style="display:flex; align-items:center; gap:6px;">
            ■ Stop Sample
          </button>
        </div>
      </div>

      <div class="waveform-card">
        <div class="waveform-canvas-container">
          <canvas id="waveformCanvas"></canvas>
        </div>
        
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
          <div class="trim-slider-container" style="flex:1;">
            <div class="control-group" style="flex:1;">
              <label>Trim Start <span id="val-trimStart">0%</span></label>
              <input type="range" id="param-trimStart" min="0" max="1" value="0" step="0.005">
            </div>
            <div class="control-group" style="flex:1;">
              <label>Trim End <span id="val-trimEnd">100%</span></label>
              <input type="range" id="param-trimEnd" min="0" max="1" value="1" step="0.005">
            </div>
            <div class="control-group" style="flex:1;">
              <label>Split / Cut Point <span id="val-cutPoint">50%</span></label>
              <input type="range" id="param-cutPoint" min="0" max="1" value="0.5" step="0.005">
            </div>
          </div>
          <button id="splitSampleBtn" class="btn btn-secondary">✂ Split Sample at Cut Point</button>
        </div>
      </div>

      <div class="controls-grid">
        <div class="control-group">
          <label>Volume <span id="val-volume">100</span></label>
          <input type="range" id="param-volume" min="0" max="150" value="100">
        </div>
        <div class="control-group">
          <label>Pitch <span id="val-pitch">0 st</span></label>
          <input type="range" id="param-pitch" min="-12" max="12" value="0" step="1">
        </div>
        <div class="control-group">
          <label>Pan <span id="val-pan">C</span></label>
          <input type="range" id="param-pan" min="-1" max="1" value="0" step="0.05">
        </div>
        <div class="control-group">
          <label>Filter Cutoff <span id="val-cutoff">20000 Hz</span></label>
          <input type="range" id="param-cutoff" min="100" max="20000" value="20000" step="100">
        </div>
      </div>

      <div class="dropdown-group">
        <div class="select-wrapper">
          <label>Select Sound from Bank</label>
          <select id="soundBankSelect"></select>
        </div>
        <div class="select-wrapper">
          <label>Assign to Pad</label>
          <select id="targetPadSelect"></select>
        </div>
      </div>
    </div>

    <div class="library-grid">
      <div class="lib-card">
        <h3>
          Captured / Soundbank Library
          <span style="font-size:0.75rem; color:var(--muted-text);" id="factoryCount">0 samples</span>
        </h3>
        <div class="sample-list" id="factorySampleList"></div>
      </div>

      <div class="lib-card">
        <h3>
          User Uploaded & Split Library
          <span style="font-size:0.75rem; color:var(--muted-text);" id="userCount">0 samples</span>
        </h3>
        <div class="sample-list" id="userSampleList"></div>
      </div>
    </div>

    <div style="background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px;">
      <h3 style="margin:0 0 8px 0; font-size:0.95rem;">Drum Pads (1-16)</h3>
      <div class="pads-grid" id="padsGrid"></div>
    </div>

  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    // Sample Libraries with path structure
    let factoryLibrary = [];
    let userLibrary = [];

    // Active audio voices tracking
    let activeVoices = [];

    // Pads State (16 Pads)
    let padsState = Array.from({ length: 16 }, (_, i) => ({
      index: i,
      name: `Pad ${i + 1}`,
      audioBuffer: null,
      volume: 100,
      pitch: 0,
      pan: 0,
      cutoff: 20000,
      trimStart: 0,
      trimEnd: 1,
      cutPoint: 0.5
    }));

    let selectedPadIndex = 0;

    // Compact Sequencer State
    const TOTAL_STEPS = 16;
    let sequenceMatrix = Array.from({ length: 16 }, () => Array(TOTAL_STEPS).fill(false));
    let isPlayingSeq = false;
    let currentSeqStep = 0;
    let seqIntervalId = null;

    // Canvas Elements
    const waveformCanvas = document.getElementById('waveformCanvas');
    const canvasCtx = waveformCanvas.getContext('2d');

    // DOM Elements
    const importPkbankBtn = document.getElementById('importPkbankBtn');
    const pkbankInput = document.getElementById('pkbankInput');
    const uploadFolderBtn = document.getElementById('uploadFolderBtn');
    const userFolderInput = document.getElementById('userFolderInput');
    const uploadSampleBtn = document.getElementById('uploadSampleBtn');
    const userSampleInput = document.getElementById('userSampleInput');
    const padsGrid = document.getElementById('padsGrid');
    const targetPadSelect = document.getElementById('targetPadSelect');
    const soundBankSelect = document.getElementById('soundBankSelect');
    const factorySampleList = document.getElementById('factorySampleList');
    const userSampleList = document.getElementById('userSampleList');
    const factoryCount = document.getElementById('factoryCount');
    const userCount = document.getElementById('userCount');

    const seqGrid = document.getElementById('seqGrid');
    const bpmInput = document.getElementById('bpmInput');
    const clearSeqBtn = document.getElementById('clearSeqBtn');
    const playSeqBtn = document.getElementById('playSeqBtn');
    const exportSeqWavBtn = document.getElementById('exportSeqWavBtn');
    const splitSampleBtn = document.getElementById('splitSampleBtn');

    const currentPadNum = document.getElementById('currentPadNum');
    const currentSoundTitle = document.getElementById('currentSoundTitle');
    const auditionBtn = document.getElementById('auditionBtn');
    const stopSampleBtn = document.getElementById('stopSampleBtn');

    const inputs = {
      volume: document.getElementById('param-volume'),
      pitch: document.getElementById('param-pitch'),
      pan: document.getElementById('param-pan'),
      cutoff: document.getElementById('param-cutoff'),
      trimStart: document.getElementById('param-trimStart'),
      trimEnd: document.getElementById('param-trimEnd'),
      cutPoint: document.getElementById('param-cutPoint')
    };

    const labels = {
      volume: document.getElementById('val-volume'),
      pitch: document.getElementById('val-pitch'),
      pan: document.getElementById('val-pan'),
      cutoff: document.getElementById('val-cutoff'),
      trimStart: document.getElementById('val-trimStart'),
      trimEnd: document.getElementById('val-trimEnd'),
      cutPoint: document.getElementById('val-cutPoint')
    };

    // Audio Context Helper
    async function ensureAudioContextRunning() {
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }
    }

    // Initialize Pad Selector Dropdown
    for (let i = 0; i < 16; i++) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.innerText = `Pad ${i + 1}`;
      targetPadSelect.appendChild(opt);
    }

    importPkbankBtn.addEventListener('click', () => pkbankInput.click());
    uploadFolderBtn.addEventListener('click', () => userFolderInput.click());
    uploadSampleBtn.addEventListener('click', () => userSampleInput.click());

    pkbankInput.addEventListener('change', async (e) => {
      if (e.target.files.length) {
        await handlePkbankImport(e.target.files[0]);
        e.target.value = '';
      }
    });

    userFolderInput.addEventListener('change', async (e) => {
      if (e.target.files.length) {
        await handleUserSampleUpload(e.target.files);
        e.target.value = '';
      }
    });

    userSampleInput.addEventListener('change', async (e) => {
      if (e.target.files.length) {
        await handleUserSampleUpload(e.target.files);
        e.target.value = '';
      }
    });

    targetPadSelect.addEventListener('change', (e) => {
      selectPad(parseInt(e.target.value));
    });

    soundBankSelect.addEventListener('change', async (e) => {
      await ensureAudioContextRunning();
      const allSamples = [...factoryLibrary, ...userLibrary];
      const selectedSample = allSamples.find(s => s.id === e.target.value);
      if (selectedSample) {
        assignSampleToPad(selectedSample, selectedPadIndex);
      }
    });

    // Clear Pattern Sequencer Grid
    clearSeqBtn.addEventListener('click', () => {
      sequenceMatrix = Array.from({ length: 16 }, () => Array(TOTAL_STEPS).fill(false));
      renderSequencerGrid();
    });

    // PKBank & Zip Import
    async function handlePkbankImport(file) {
      await ensureAudioContextRunning();
      try {
        const zip = await JSZip.loadAsync(file);
        const manifestFile = zip.file('manifest.json');
        let manifest = { pads: [] };

        if (manifestFile) {
          try {
            const text = await manifestFile.async('string');
            manifest = JSON.parse(text);
          } catch (err) {
            console.warn("manifest.json syntax error; falling back to audio extraction:", err);
          }
        }

        // Parse Sequencer Steps from JSON manifest if available
        if (manifest) {
          if (Array.isArray(manifest.sequenceMatrix)) {
            sequenceMatrix = manifest.sequenceMatrix;
          } else if (Array.isArray(manifest.sequence)) {
            sequenceMatrix = manifest.sequence;
          } else if (Array.isArray(manifest.pads)) {
            manifest.pads.forEach((p, idx) => {
              if (p && Array.isArray(p.steps) && idx < 16) {
                sequenceMatrix[idx] = p.steps;
              }
            });
          }
        }

        const audioFiles = Object.keys(zip.files).filter(name => name.toLowerCase().endsWith('.wav') || name.toLowerCase().endsWith('.mp3'));

        for (let i = 0; i < audioFiles.length; i++) {
          const filePath = audioFiles[i];
          const fileData = await zip.file(filePath).async('arraybuffer');
          const buffer = await audioCtx.decodeAudioData(fileData);

          const fileNameOnly = filePath.split('/').pop().replace(/\.[^/.]+$/, '');
          const padMeta = (manifest && Array.isArray(manifest.pads)) 
            ? manifest.pads.find(p => p && (p.audioFile === filePath || p.file === filePath)) 
            : null;
          const name = padMeta ? padMeta.name : fileNameOnly;

          if (!factoryLibrary.some(s => s.path === filePath)) {
            factoryLibrary.push({
              id: `fact_${Date.now()}_${Math.random()}`,
              name,
              path: filePath,
              buffer
            });
          }

          const index = padMeta && padMeta.index !== undefined ? padMeta.index : i;
          if (index >= 0 && index < 16) {
            padsState[index].name = name;
            padsState[index].audioBuffer = buffer;
            if (padMeta) {
              padsState[index].volume = padMeta.volume ?? 100;
              padsState[index].pitch = padMeta.pitch ?? 0;
              padsState[index].pan = padMeta.pan ?? 0;
              padsState[index].cutoff = padMeta.cutoff ?? 20000;
              padsState[index].trimStart = padMeta.trimStart ?? 0;
              padsState[index].trimEnd = padMeta.trimEnd ?? 1;
            }
          }
        }

        refreshSoundBankDropdown();
        renderLibraries();
        renderPads();
        renderSequencerGrid();
        selectPad(0);
      } catch (err) {
        console.error("Failed to extract .pkbank file:", err);
        alert("Failed to extract .pkbank file. Ensure it is a valid archive containing audio samples.");
      }
    }

    // Handle Uploaded Audio Files & Folders
    async function handleUserSampleUpload(files) {
      await ensureAudioContextRunning();
      for (const file of files) {
        try {
          const arrayBuffer = await file.arrayBuffer();
          const buffer = await audioCtx.decodeAudioData(arrayBuffer);
          const isVideo = file.type.startsWith('video/') || /\.(mp4|mov|webm|avi|mkv)$/i.test(file.name);
          const rawName = file.name.replace(/\.[^/.]+$/, "");
          const name = (isVideo ? '[Vid] ' : '') + rawName;
          
          // Use relative path if uploading folder hierarchy
          const relPath = file.webkitRelativePath || file.name;

          const newSample = {
            id: `usr_${Date.now()}_${Math.random()}`,
            name,
            path: relPath,
            buffer
          };
          userLibrary.push(newSample);

          // Auto-assign uploaded sample to active pad
          assignSampleToPad(newSample, selectedPadIndex);
        } catch (err) {
          console.error("Could not decode audio from file:", file.name, err);
        }
      }

      refreshSoundBankDropdown();
      renderLibraries();
    }

    // Hierarchical Folder Tree Builder
    function buildTreeFromPaths(sampleList) {
      const root = { name: 'root', folders: {}, files: [] };
      sampleList.forEach(sample => {
        const parts = sample.path.split('/').filter(Boolean);
        if (parts.length === 1) {
          root.files.push(sample);
        } else {
          let current = root;
          for (let i = 0; i < parts.length - 1; i++) {
            const folderName = parts[i];
            if (!current.folders[folderName]) {
              current.folders[folderName] = { name: folderName, folders: {}, files: [] };
            }
            current = current.folders[folderName];
          }
          current.files.push(sample);
        }
      });
      return root;
    }

    // Render Folder Tree UI recursively
    function renderFolderNode(node, container) {
      Object.keys(node.folders).forEach(folderName => {
        const folder = node.folders[folderName];
        const details = document.createElement('details');
        details.className = 'folder-tree';
        details.open = true;

        const summary = document.createElement('summary');
        summary.innerText = `📁 ${folder.name}`;
        details.appendChild(summary);

        renderFolderNode(folder, details);
        container.appendChild(details);
      });

      node.files.forEach(sample => {
        const item = document.createElement('div');
        item.className = 'sample-item';
        item.innerHTML = `
          <span>🔊 ${sample.name}</span>
          <button class="btn btn-secondary">Load to Pad</button>
        `;
        item.querySelector('button').addEventListener('click', async () => {
          await ensureAudioContextRunning();
          assignSampleToPad(sample, selectedPadIndex);
        });
        container.appendChild(item);
      });
    }

    function renderLibraries() {
      factoryCount.innerText = `${factoryLibrary.length} samples`;
      userCount.innerText = `${userLibrary.length} samples`;

      factorySampleList.innerHTML = '';
      const factoryTree = buildTreeFromPaths(factoryLibrary);
      renderFolderNode(factoryTree, factorySampleList);

      userSampleList.innerHTML = '';
      const userTree = buildTreeFromPaths(userLibrary);
      renderFolderNode(userTree, userSampleList);
    }

    // Populate Sound Bank Dropdown with Folder Groups
    function refreshSoundBankDropdown() {
      soundBankSelect.innerHTML = '<option value="">-- Choose Sample from Sound Bank --</option>';
      
      const populateGrouped = (library, groupTitle) => {
        if (!library.length) return;
        const mainGroup = document.createElement('optgroup');
        mainGroup.label = `--- ${groupTitle} ---`;
        soundBankSelect.appendChild(mainGroup);

        library.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.id;
          opt.innerText = `${s.path}`;
          soundBankSelect.appendChild(opt);
        });
      };

      populateGrouped(factoryLibrary, 'Factory / PKBank Library');
      populateGrouped(userLibrary, 'User Uploaded / Split Library');
    }

    function assignSampleToPad(sample, padIdx) {
      padsState[padIdx].name = sample.name;
      padsState[padIdx].audioBuffer = sample.buffer;
      renderPads();
      renderSequencerGrid();
      selectPad(padIdx);
      triggerPadAudio(padIdx);
    }

    function renderPads() {
      padsGrid.innerHTML = '';
      padsState.forEach((pad, i) => {
        const btn = document.createElement('div');
        btn.className = `pad-btn ${selectedPadIndex === i ? 'active' : ''}`;
        btn.innerHTML = `
          <div class="pad-index">PAD ${String(i + 1).padStart(2, '0')}</div>
          <div class="pad-name">${pad.name}</div>
        `;
        btn.addEventListener('click', async () => {
          await ensureAudioContextRunning();
          selectPad(i);
          triggerPadAudio(i);
        });
        padsGrid.appendChild(btn);
      });
    }

    function renderSequencerGrid() {
      seqGrid.innerHTML = '';
      for (let padIdx = 0; padIdx < 16; padIdx++) {
        const pad = padsState[padIdx];
        const label = document.createElement('div');
        label.className = 'seq-row-label';
        label.innerText = pad.name;
        seqGrid.appendChild(label);

        for (let stepIdx = 0; stepIdx < TOTAL_STEPS; stepIdx++) {
          const stepCell = document.createElement('div');
          stepCell.className = `seq-step ${sequenceMatrix[padIdx][stepIdx] ? 'active' : ''}`;
          stepCell.dataset.pad = padIdx;
          stepCell.dataset.step = stepIdx;
          stepCell.addEventListener('click', () => {
            sequenceMatrix[padIdx][stepIdx] = !sequenceMatrix[padIdx][stepIdx];
            stepCell.classList.toggle('active', sequenceMatrix[padIdx][stepIdx]);
          });
          seqGrid.appendChild(stepCell);
        }
      }
    }

    function selectPad(index) {
      selectedPadIndex = index;
      targetPadSelect.value = index;

      document.querySelectorAll('.pad-btn').forEach((b, i) => {
        b.classList.toggle('active', i === index);
      });

      const pad = padsState[index];
      currentPadNum.innerText = String(index + 1).padStart(2, '0');
      currentSoundTitle.innerText = pad.name;

      inputs.volume.value = pad.volume;
      inputs.pitch.value = pad.pitch;
      inputs.pan.value = pad.pan;
      inputs.cutoff.value = pad.cutoff;
      inputs.trimStart.value = pad.trimStart;
      inputs.trimEnd.value = pad.trimEnd;
      inputs.cutPoint.value = pad.cutPoint;

      updateLabels();
      drawWaveform();
    }

    function updateLabels() {
      labels.volume.innerText = inputs.volume.value;
      labels.pitch.innerText = `${inputs.pitch.value} st`;
      labels.pan.innerText = inputs.pan.value == 0 ? 'C' : (inputs.pan.value < 0 ? `L${Math.abs(inputs.pan.value)}` : `R${inputs.pan.value}`);
      labels.cutoff.innerText = `${inputs.cutoff.value} Hz`;
      labels.trimStart.innerText = `${Math.round(inputs.trimStart.value * 100)}%`;
      labels.trimEnd.innerText = `${Math.round(inputs.trimEnd.value * 100)}%`;
      labels.cutPoint.innerText = `${Math.round(inputs.cutPoint.value * 100)}%`;

      const pad = padsState[selectedPadIndex];
      pad.volume = parseFloat(inputs.volume.value);
      pad.pitch = parseFloat(inputs.pitch.value);
      pad.pan = parseFloat(inputs.pan.value);
      pad.cutoff = parseFloat(inputs.cutoff.value);
      pad.trimStart = parseFloat(inputs.trimStart.value);
      pad.trimEnd = parseFloat(inputs.trimEnd.value);
      pad.cutPoint = parseFloat(inputs.cutPoint.value);

      drawWaveform();
    }

    Object.values(inputs).forEach(input => input.addEventListener('input', updateLabels));

    // Render Canvas Waveform
    function drawWaveform() {
      const pad = padsState[selectedPadIndex];
      const width = waveformCanvas.width = waveformCanvas.clientWidth;
      const height = waveformCanvas.height = waveformCanvas.clientHeight;

      canvasCtx.clearRect(0, 0, width, height);
      if (!pad || !pad.audioBuffer) {
        canvasCtx.fillStyle = '#4b5563';
        canvasCtx.font = '12px sans-serif';
        canvasCtx.fillText('No Audio Loaded on Selected Pad', 10, height / 2 + 4);
        return;
      }

      const data = pad.audioBuffer.getChannelData(0);
      const step = Math.ceil(data.length / width);
      const amp = height / 2;

      // Draw Base Waveform
      canvasCtx.beginPath();
      canvasCtx.strokeStyle = '#3b82f6';
      canvasCtx.lineWidth = 1;

      for (let i = 0; i < width; i++) {
        let min = 1.0;
        let max = -1.0;
        for (let j = 0; j < step; j++) {
          const datum = data[(i * step) + j];
          if (datum < min) min = datum;
          if (datum > max) max = datum;
        }
        canvasCtx.moveTo(i, (1 + min) * amp);
        canvasCtx.lineTo(i, (1 + max) * amp);
      }
      canvasCtx.stroke();

      // Draw Trim Mask
      const trimStartPx = pad.trimStart * width;
      const trimEndPx = pad.trimEnd * width;

      canvasCtx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      canvasCtx.fillRect(0, 0, trimStartPx, height);
      canvasCtx.fillRect(trimEndPx, 0, width - trimEndPx, height);

      // Draw Trim Handles
      canvasCtx.strokeStyle = '#00e676';
      canvasCtx.lineWidth = 2;
      canvasCtx.beginPath();
      canvasCtx.moveTo(trimStartPx, 0); canvasCtx.lineTo(trimStartPx, height);
      canvasCtx.moveTo(trimEndPx, 0); canvasCtx.lineTo(trimEndPx, height);
      canvasCtx.stroke();

      // Draw Split Cut Line
      const cutPx = pad.cutPoint * width;
      canvasCtx.strokeStyle = '#ef4444';
      canvasCtx.lineWidth = 2;
      canvasCtx.setLineDash([4, 4]);
      canvasCtx.beginPath();
      canvasCtx.moveTo(cutPx, 0); canvasCtx.lineTo(cutPx, height);
      canvasCtx.stroke();
      canvasCtx.setLineDash([]);
    }

    // WAV Split Functionality
    splitSampleBtn.addEventListener('click', async () => {
      await ensureAudioContextRunning();
      const pad = padsState[selectedPadIndex];
      if (!pad || !pad.audioBuffer) return;

      const buffer = pad.audioBuffer;
      const cutIndex = Math.floor(buffer.length * pad.cutPoint);

      if (cutIndex <= 0 || cutIndex >= buffer.length) return;

      // Slice Part 1
      const part1Length = cutIndex;
      const part1Buffer = audioCtx.createBuffer(buffer.numberOfChannels, part1Length, buffer.sampleRate);
      for (let ch = 0; ch < buffer.numberOfChannels; ch++) {
        part1Buffer.getChannelData(ch).set(buffer.getChannelData(ch).subarray(0, part1Length));
      }

      // Slice Part 2
      const part2Length = buffer.length - cutIndex;
      const part2Buffer = audioCtx.createBuffer(buffer.numberOfChannels, part2Length, buffer.sampleRate);
      for (let ch = 0; ch < buffer.numberOfChannels; ch++) {
        part2Buffer.getChannelData(ch).set(buffer.getChannelData(ch).subarray(cutIndex));
      }

      const name1 = `${pad.name}_pt1`;
      const name2 = `${pad.name}_pt2`;
      userLibrary.push({ id: `usr_${Date.now()}_1`, name: name1, path: name1, buffer: part1Buffer });
      userLibrary.push({ id: `usr_${Date.now()}_2`, name: name2, path: name2, buffer: part2Buffer });
      assignSampleToPad({ name: name1, buffer: part1Buffer }, selectedPadIndex);

      refreshSoundBankDropdown();
      renderLibraries();
    });

    auditionBtn.addEventListener('click', async () => {
      await ensureAudioContextRunning();
      stopAllVoices();
      triggerPadAudio(selectedPadIndex);
    });

    stopSampleBtn.addEventListener('click', () => {
      stopAllVoices();
    });

    function triggerPadAudio(index, targetCtx = audioCtx, targetTime = 0) {
      const pad = padsState[index];
      if (!pad || !pad.audioBuffer) return;

      const source = targetCtx.createBufferSource();
      source.buffer = pad.audioBuffer;

      source.playbackRate.value = Math.pow(2, pad.pitch / 12);
      const filter = targetCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = pad.cutoff || 20000;

      const gainNode = targetCtx.createGain();
      gainNode.gain.value = pad.volume / 100;

      const panner = targetCtx.createStereoPanner();
      panner.pan.value = pad.pan;

      source.connect(filter);
      filter.connect(gainNode);
      gainNode.connect(panner);
      panner.connect(targetCtx.destination);

      const duration = pad.audioBuffer.duration;
      const startTime = (pad.trimStart || 0) * duration;
      const playDuration = Math.max(0.01, ((pad.trimEnd || 1) - (pad.trimStart || 0)) * duration);
      source.start(targetTime, startTime, playDuration);

      if (targetCtx === audioCtx) {
        activeVoices.push(source);
        source.onended = () => {
          activeVoices = activeVoices.filter(s => s !== source);
        };

        const padEl = padsGrid.children[index];
        if (padEl) {
          padEl.classList.add('playing');
          setTimeout(() => padEl.classList.remove('playing'), 120);
        }
      }
    }

    function stopAllVoices() {
      activeVoices.forEach(source => {
        try {
          source.stop(0);
          source.disconnect();
        } catch (e) {}
      });
      activeVoices = [];
    }

    // Step Sequencer Playback
    playSeqBtn.addEventListener('click', async () => {
      await ensureAudioContextRunning();
      if (isPlayingSeq) {
        stopSequence();
      } else {
        startSequence();
      }
    });

    function startSequence() {
      isPlayingSeq = true;
      playSeqBtn.innerText = 'Pause Sequence';
      currentSeqStep = 0;

      const runStep = () => {
        document.querySelectorAll('.seq-step').forEach(cell => {
          cell.classList.toggle('current-play', parseInt(cell.dataset.step) === currentSeqStep);
        });

        for (let padIdx = 0; padIdx < 16; padIdx++) {
          if (sequenceMatrix[padIdx][currentSeqStep]) {
            triggerPadAudio(padIdx);
          }
        }

        currentSeqStep = (currentSeqStep + 1) % TOTAL_STEPS;
      };

      runStep();
      const intervalMs = (60 / parseFloat(bpmInput.value) / 4) * 1000;
      seqIntervalId = setInterval(runStep, intervalMs);
    }

    function stopSequence() {
      isPlayingSeq = false;
      playSeqBtn.innerText = 'Play Sequence';
      clearInterval(seqIntervalId);
      stopAllVoices();
      document.querySelectorAll('.seq-step').forEach(cell => cell.classList.remove('current-play'));
    }

    // Export WAV Sequence Loop
    async function renderSequenceToAudioBuffer() {
      const bpm = parseFloat(bpmInput.value) || 120;
      const secondsPerStep = 60 / bpm / 4;
      const totalSequenceDuration = secondsPerStep * TOTAL_STEPS + 1.5;
      const sampleRate = 48000;
      const offlineCtx = new OfflineAudioContext(2, Math.ceil(sampleRate * totalSequenceDuration), sampleRate);

      for (let stepIdx = 0; stepIdx < TOTAL_STEPS; stepIdx++) {
        const stepTime = stepIdx * secondsPerStep;
        for (let padIdx = 0; padIdx < 16; padIdx++) {
          if (sequenceMatrix[padIdx][stepIdx]) {
            triggerPadAudio(padIdx, offlineCtx, stepTime);
          }
        }
      }

      return await offlineCtx.startRendering();
    }

    function audioBufferToWavBlob(buffer) {
      const numChannels = buffer.numberOfChannels;
      const sampleRate = buffer.sampleRate;
      const bitDepth = 16;
      
      let samples;
      if (numChannels === 2) {
        const left = buffer.getChannelData(0);
        const right = buffer.getChannelData(1);
        samples = new Float32Array(left.length + right.length);
        for (let i = 0, j = 0; i < left.length; i++, j += 2) {
          samples[j] = left[i];
          samples[j + 1] = right[i];
        }
      } else {
        samples = buffer.getChannelData(0);
      }

      const bytesPerSample = bitDepth / 8;
      const blockAlign = numChannels * bytesPerSample;
      const bufferLength = 44 + samples.length * bytesPerSample;
      const arrayBuffer = new ArrayBuffer(bufferLength);
      const view = new DataView(arrayBuffer);

      const writeString = (offset, str) => {
        for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
      };

      writeString(0, 'RIFF');
      view.setUint32(4, 36 + samples.length * bytesPerSample, true);
      writeString(8, 'WAVE');
      writeString(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * blockAlign, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, bitDepth, true);
      writeString(36, 'data');
      view.setUint32(40, samples.length * bytesPerSample, true);

      let offset = 44;
      for (let i = 0; i < samples.length; i++, offset += 2) {
        const s = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      }

      return new Blob([arrayBuffer], { type: 'audio/wav' });
    }

    function triggerDownload(blob, filename) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
    }

    exportSeqWavBtn.addEventListener('click', async () => {
      exportSeqWavBtn.innerText = 'Rendering WAV...';
      try {
        const renderedBuffer = await renderSequenceToAudioBuffer();
        const wavBlob = audioBufferToWavBlob(renderedBuffer);
        triggerDownload(wavBlob, 'sequence_loop.wav');
      } catch (err) {
        console.error(err);
      } finally {
        exportSeqWavBtn.innerText = 'Export Sequence WAV';
      }
    });

    // Initial Setup
    renderPads();
    renderSequencerGrid();
    renderLibraries();
    refreshSoundBankDropdown();
    selectPad(0);
  </script>
</body>
</html>
