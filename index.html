<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pulsark Sampler, Library & Sequence Exporter</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg-color: #0b0f19;
      --panel-bg: #111827;
      --card-bg: #1f293d;
      --accent-color: #00e676;
      --accent-hover: #00c853;
      --btn-blue: #1d4ed8;
      --btn-blue-hover: #2563eb;
      --text-color: #f3f4f6;
      --muted-text: #9ca3af;
      --border-color: #374151;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1280px;
      margin: 0 auto 20px auto;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 15px;
    }

    h1 { margin: 0; font-size: 1.4rem; color: #fff; }
    .header-actions { display: flex; gap: 10px; }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    /* Sound Control Panel (Matching UI Design) */
    .sound-editor-card {
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
    }

    .editor-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .sound-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;
    }

    .source-banner {
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--muted-text);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
    }

    .control-group label {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      margin-bottom: 6px;
      color: var(--muted-text);
      text-transform: uppercase;
      font-weight: 600;
    }

    .control-group input[type="range"] {
      width: 100%;
      accent-color: #3b82f6;
    }

    .dropdown-group {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
    }

    .select-wrapper {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
    }

    .select-wrapper label {
      font-size: 0.75rem;
      color: var(--muted-text);
      text-transform: uppercase;
      font-weight: 600;
    }

    select {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      outline: none;
    }

    /* Library Panels */
    .library-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .lib-card {
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 18px;
    }

    .lib-card h3 {
      margin-top: 0;
      font-size: 1rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sample-list {
      max-height: 200px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 10px;
    }

    .sample-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--card-bg);
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 0.85rem;
    }

    .sample-item button {
      padding: 4px 8px;
      font-size: 0.75rem;
    }

    /* Pads Grid */
    .pads-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .pad-btn {
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px;
      color: var(--text-color);
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 65px;
      transition: all 0.1s ease;
    }

    .pad-btn:hover { border-color: #3b82f6; }
    .pad-btn.active { border-color: var(--accent-color); box-shadow: 0 0 10px rgba(0,230,118,0.2); }
    .pad-btn.playing { background-color: #1e293b; transform: scale(0.98); }

    .pad-index { font-size: 0.65rem; color: var(--muted-text); font-weight: bold; }
    .pad-name { font-weight: bold; font-size: 0.8rem; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* UI Buttons */
    .btn {
      background-color: var(--btn-blue);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover { background-color: var(--btn-blue-hover); }
    .btn-green { background-color: var(--accent-color); color: #000; }
    .btn-green:hover { background-color: var(--accent-hover); }
    .btn-secondary { background-color: #374151; }
    .btn-secondary:hover { background-color: #4b5563; }

    input[type="file"] { display: none; }
  </style>
</head>
<body>

  <header>
    <h1>Pulsark Kit & Sample Library Editor</h1>
    <div class="header-actions">
      <button id="importPkbankBtn" class="btn btn-secondary">Import .pkbank</button>
      <button id="exportSeqWavBtn" class="btn btn-green">Export Sequence WAV</button>
      <input type="file" id="pkbankInput" accept=".pkbank,.zip">
      <input type="file" id="userSampleInput" accept="audio/*" multiple>
    </div>
  </header>

  <div class="container">
    
    <div class="sound-editor-card">
      <div class="editor-top-bar">
        <div>
          <span style="font-size:0.75rem; color:var(--muted-text); font-weight:bold;">BANK A · SOUND <span id="currentPadNum">01</span></span>
          <div class="sound-title" id="currentSoundTitle">BD 808</div>
        </div>
        <button id="auditionBtn" class="btn btn-green" style="display:flex; align-items:center; gap:6px;">
          ▶ Audition sound
        </button>
      </div>

      <div class="source-banner">
        <div>
          <strong style="color:#fff;">SOURCE</strong><br>
          <span id="sourceDescription">Factory sample from bank Drums 808. Sound controls below apply on playback and export.</span>
        </div>
        <button id="uploadSampleBtn" class="btn btn-secondary">Upload sample</button>
      </div>

      <div style="font-size:0.75rem; color:var(--muted-text); font-weight:bold; margin-bottom:10px;">SOUND · PLAYBACK</div>
      
      <div class="controls-grid">
        <div class="control-group">
          <label>Volume <span id="val-volume">100</span></label>
          <input type="range" id="param-volume" min="0" max="150" value="100">
        </div>
        <div class="control-group">
          <label>Pitch <span id="val-pitch">0 st</span></label>
          <input type="range" id="param-pitch" min="-12" max="12" value="0" step="1">
        </div>
        <div class="control-group">
          <label>Pan <span id="val-pan">C</span></label>
          <input type="range" id="param-pan" min="-1" max="1" value="0" step="0.05">
        </div>
        <div class="control-group">
          <label>Attack <span id="val-attack">0 ms</span></label>
          <input type="range" id="param-attack" min="0" max="1000" value="0">
        </div>
        <div class="control-group">
          <label>Decay <span id="val-decay">2.0 s</span></label>
          <input type="range" id="param-decay" min="0.1" max="5" value="2" step="0.1">
        </div>
        <div class="control-group">
          <label>Release <span id="val-release">2.0 s</span></label>
          <input type="range" id="param-release" min="0.1" max="5" value="2" step="0.1">
        </div>
      </div>

      <div class="dropdown-group">
        <div class="select-wrapper">
          <label>Play mode</label>
          <select id="param-playMode">
            <option value="FWD">FWD</option>
            <option value="REV">REV</option>
          </select>
        </div>
        <div class="select-wrapper">
          <label>Choke group</label>
          <select id="param-chokeGroup">
            <option value="0">Off</option>
            <option value="1">Group 1</option>
            <option value="2">Group 2</option>
          </select>
        </div>
        <div class="select-wrapper">
          <label>Assign Sample To Pad</label>
          <select id="targetPadSelect"></select>
        </div>
      </div>
    </div>

    <div class="library-grid">
      <div class="lib-card">
        <h3>
          Captured / Soundbank Library
          <span style="font-size:0.75rem; color:var(--muted-text);" id="factoryCount">0 samples</span>
        </h3>
        <div class="sample-list" id="factorySampleList"></div>
      </div>

      <div class="lib-card">
        <h3>
          User Uploaded Library
          <span style="font-size:0.75rem; color:var(--muted-text);" id="userCount">0 samples</span>
        </h3>
        <div class="sample-list" id="userSampleList"></div>
      </div>
    </div>

    <div style="background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 18px;">
      <h3 style="margin:0 0 10px 0; font-size:1rem;">Target Drum Pads (1-16)</h3>
      <div class="pads-grid" id="padsGrid"></div>
    </div>

  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    // Sample Libraries
    let factoryLibrary = []; // Captured from PKBank imports
    let userLibrary = [];    // Uploaded directly by user

    // Pads State (16 Pads)
    let padsState = Array.from({ length: 16 }, (_, i) => ({
      index: i,
      name: `Pad ${i + 1}`,
      audioBuffer: null,
      volume: 100,
      pitch: 0,
      pan: 0,
      attack: 0,
      decay: 2,
      release: 2,
      playMode: 'FWD',
      chokeGroup: 0
    }));

    let selectedPadIndex = 0;

    // DOM Elements
    const importPkbankBtn = document.getElementById('importPkbankBtn');
    const pkbankInput = document.getElementById('pkbankInput');
    const uploadSampleBtn = document.getElementById('uploadSampleBtn');
    const userSampleInput = document.getElementById('userSampleInput');
    const padsGrid = document.getElementById('padsGrid');
    const targetPadSelect = document.getElementById('targetPadSelect');

    const factorySampleList = document.getElementById('factorySampleList');
    const userSampleList = document.getElementById('userSampleList');
    const factoryCount = document.getElementById('factoryCount');
    const userCount = document.getElementById('userCount');

    // Controls
    const currentPadNum = document.getElementById('currentPadNum');
    const currentSoundTitle = document.getElementById('currentSoundTitle');
    const auditionBtn = document.getElementById('auditionBtn');

    const inputs = {
      volume: document.getElementById('param-volume'),
      pitch: document.getElementById('param-pitch'),
      pan: document.getElementById('param-pan'),
      attack: document.getElementById('param-attack'),
      decay: document.getElementById('param-decay'),
      release: document.getElementById('param-release'),
      playMode: document.getElementById('param-playMode'),
      chokeGroup: document.getElementById('param-chokeGroup')
    };

    const labels = {
      volume: document.getElementById('val-volume'),
      pitch: document.getElementById('val-pitch'),
      pan: document.getElementById('val-pan'),
      attack: document.getElementById('val-attack'),
      decay: document.getElementById('val-decay'),
      release: document.getElementById('val-release')
    };

    // Initialize Target Pad Selector
    for (let i = 0; i < 16; i++) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.innerText = `Pad ${i + 1}`;
      targetPadSelect.appendChild(opt);
    }

    // Event Listeners
    importPkbankBtn.addEventListener('click', () => pkbankInput.click());
    uploadSampleBtn.addEventListener('click', () => userSampleInput.click());

    pkbankInput.addEventListener('change', async (e) => {
      if (e.target.files.length) await handlePkbankImport(e.target.files[0]);
    });

    userSampleInput.addEventListener('change', async (e) => {
      if (e.target.files.length) await handleUserSampleUpload(e.target.files);
    });

    targetPadSelect.addEventListener('change', (e) => {
      selectPad(parseInt(e.target.value));
    });

    // Import PKBank & Capture Samples into Persistent Library
    async function handlePkbankImport(file) {
      const zip = await JSZip.loadAsync(file);
      const manifestFile = zip.file('manifest.json');
      let manifest = { pads: [] };

      if (manifestFile) {
        const text = await manifestFile.async('string');
        manifest = JSON.parse(text);
      }

      const audioFiles = Object.keys(zip.files).filter(name => name.endsWith('.wav'));

      for (const filePath of audioFiles) {
        const fileData = await zip.file(filePath).async('arraybuffer');
        const buffer = await audioCtx.decodeAudioData(fileData);

        const padMeta = manifest.pads ? manifest.pads.find(p => p.audioFile === filePath) : null;
        const name = padMeta ? padMeta.name : filePath.split('/').pop().replace('.wav', '');

        // Capture to Factory Library without replacing existing ones
        if (!factoryLibrary.some(s => s.name === name)) {
          factoryLibrary.push({ id: `fact_${Date.now()}_${Math.random()}`, name, buffer });
        }

        // Auto-assign first 16 samples to corresponding pads
        const index = padMeta ? padMeta.index : factoryLibrary.length - 1;
        if (index >= 0 && index < 16) {
          padsState[index].name = name;
          padsState[index].audioBuffer = buffer;
          if (padMeta) {
            padsState[index].volume = padMeta.volume ?? 100;
            padsState[index].pitch = padMeta.pitch ?? 0;
            padsState[index].pan = padMeta.pan ?? 0;
          }
        }
      }

      renderLibraries();
      renderPads();
      selectPad(0);
    }

    // Upload Samples into User Library
    async function handleUserSampleUpload(files) {
      for (const file of files) {
        const arrayBuffer = await file.arrayBuffer();
        const buffer = await audioCtx.decodeAudioData(arrayBuffer);
        const name = file.name.replace(/\.[^/.]+$/, "");

        userLibrary.push({
          id: `usr_${Date.now()}_${Math.random()}`,
          name,
          buffer
        });
      }

      renderLibraries();
    }

    // Render Library Panels
    function renderLibraries() {
      factoryCount.innerText = `${factoryLibrary.length} samples`;
      userCount.innerText = `${userLibrary.length} samples`;

      factorySampleList.innerHTML = '';
      factoryLibrary.forEach(sample => {
        const item = document.createElement('div');
        item.className = 'sample-item';
        item.innerHTML = `
          <span>${sample.name}</span>
          <button class="btn btn-secondary">Load to Selected Pad</button>
        `;
        item.querySelector('button').addEventListener('click', () => assignSampleToCurrentPad(sample));
        factorySampleList.appendChild(item);
      });

      userSampleList.innerHTML = '';
      userLibrary.forEach(sample => {
        const item = document.createElement('div');
        item.className = 'sample-item';
        item.innerHTML = `
          <span>${sample.name}</span>
          <button class="btn btn-secondary">Load to Selected Pad</button>
        `;
        item.querySelector('button').addEventListener('click', () => assignSampleToCurrentPad(sample));
        userSampleList.appendChild(item);
      });
    }

    function assignSampleToCurrentPad(sample) {
      padsState[selectedPadIndex].name = sample.name;
      padsState[selectedPadIndex].audioBuffer = sample.buffer;
      renderPads();
      selectPad(selectedPadIndex);
      triggerPadAudio(selectedPadIndex);
    }

    // Render Pads Grid
    function renderPads() {
      padsGrid.innerHTML = '';
      padsState.forEach((pad, i) => {
        const btn = document.createElement('div');
        btn.className = `pad-btn ${selectedPadIndex === i ? 'active' : ''}`;
        btn.innerHTML = `
          <div class="pad-index">PAD ${String(i + 1).padStart(2, '0')}</div>
          <div class="pad-name">${pad.name}</div>
        `;
        btn.addEventListener('click', () => {
          selectPad(i);
          triggerPadAudio(i);
        });
        padsGrid.appendChild(btn);
      });
    }

    function selectPad(index) {
      selectedPadIndex = index;
      targetPadSelect.value = index;

      document.querySelectorAll('.pad-btn').forEach((b, i) => {
        b.classList.toggle('active', i === index);
      });

      const pad = padsState[index];
      currentPadNum.innerText = String(index + 1).padStart(2, '0');
      currentSoundTitle.innerText = pad.name;

      inputs.volume.value = pad.volume;
      inputs.pitch.value = pad.pitch;
      inputs.pan.value = pad.pan;
      inputs.attack.value = pad.attack;
      inputs.decay.value = pad.decay;
      inputs.release.value = pad.release;
      inputs.playMode.value = pad.playMode;
      inputs.chokeGroup.value = pad.chokeGroup;

      updateLabels();
    }

    function updateLabels() {
      labels.volume.innerText = inputs.volume.value;
      labels.pitch.innerText = `${inputs.pitch.value} st`;
      labels.pan.innerText = inputs.pan.value == 0 ? 'C' : (inputs.pan.value < 0 ? `L${Math.abs(inputs.pan.value)}` : `R${inputs.pan.value}`);
      labels.attack.innerText = `${inputs.attack.value} ms`;
      labels.decay.innerText = `${inputs.decay.value} s`;
      labels.release.innerText = `${inputs.release.value} s`;

      // Save parameters back to selected pad
      const pad = padsState[selectedPadIndex];
      pad.volume = parseFloat(inputs.volume.value);
      pad.pitch = parseFloat(inputs.pitch.value);
      pad.pan = parseFloat(inputs.pan.value);
      pad.attack = parseFloat(inputs.attack.value);
      pad.decay = parseFloat(inputs.decay.value);
      pad.release = parseFloat(inputs.release.value);
      pad.playMode = inputs.playMode.value;
      pad.chokeGroup = parseInt(inputs.chokeGroup.value);
    }

    Object.values(inputs).forEach(input => input.addEventListener('input', updateLabels));

    auditionBtn.addEventListener('click', () => triggerPadAudio(selectedPadIndex));

    function triggerPadAudio(index) {
      const pad = padsState[index];
      if (!pad || !pad.audioBuffer) return;

      if (audioCtx.state === 'suspended') audioCtx.resume();

      const source = audioCtx.createBufferSource();
      source.buffer = pad.audioBuffer;

      // Pitch adjustment
      source.playbackRate.value = Math.pow(2, pad.pitch / 12);

      // Gain / Volume adjustment
      const gainNode = audioCtx.createGain();
      gainNode.gain.value = pad.volume / 100;

      // Stereo Panner
      const panner = audioCtx.createStereoPanner();
      panner.pan.value = pad.pan;

      source.connect(gainNode);
      gainNode.connect(panner);
      panner.connect(audioCtx.destination);

      source.start(0);

      const padEl = padsGrid.children[index];
      if (padEl) {
        padEl.classList.add('playing');
        setTimeout(() => padEl.classList.remove('playing'), 120);
      }
    }

    // Initial Setup
    renderPads();
    renderLibraries();
    selectPad(0);
  </script>
</body>
</html>
